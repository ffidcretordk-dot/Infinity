{% extends "base_public.html" %}
{% block title %}লগইন - InfinityWork{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-10">
  <div class="glass-card rounded-[2rem] p-6 sm:p-8 w-full max-w-md space-y-5">
    <!-- Logo + Heading -->
    <div class="text-center space-y-2">
      <a href="/" class="inline-flex items-center gap-2 font-extrabold text-xl text-emerald-950">
        <span class="w-9 h-9 rounded-xl bg-emerald-900 text-white flex items-center justify-center shadow-sm">
          <i class="fa-solid fa-infinity text-sm"></i>
        </span>
        <span>InfinityWork</span>
      </a>

      <h1 class="text-2xl font-extrabold text-emerald-950 pt-1">অ্যাকাউন্টে লগইন করুন</h1>

      <div class="inline-flex items-center gap-1.5 bg-emerald-100 border border-emerald-200 text-emerald-900 px-3.5 py-1 rounded-full text-xs font-extrabold">
        <i class="fa-solid fa-shield-halved text-emerald-700"></i>
        <span>নিরাপদ ও ফ্রি ইনকাম প্ল্যাটফর্ম</span>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form" action="/login" method="POST" class="space-y-4">
      <div>
        <label class="text-xs font-bold text-emerald-900 block mb-1">ইমেইল</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-emerald-600 text-xs"></i>
          <input type="email" name="email" required placeholder="you@gmail.com"
                 class="w-full pl-10 pr-4 py-3 rounded-2xl border border-emerald-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-bold text-emerald-900">পাসওয়ার্ড</label>
          <a href="{{ support_url }}" target="_blank" class="text-[11px] font-bold text-emerald-700 hover:underline">
            পাসওয়ার্ড ভুলে গেছেন?
          </a>
        </div>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-emerald-600 text-xs"></i>
          <input id="login-pw" type="password" name="password" required placeholder="••••••••"
                 class="w-full pl-10 pr-10 py-3 rounded-2xl border border-emerald-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
          <button type="button" onclick="toggleLoginPw()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-emerald-700">
            <i id="login-pw-eye" class="fa-solid fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <button id="login-submit-btn" type="submit"
              class="w-full btn-primary-green text-white py-3.5 rounded-full font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 disabled:opacity-60">
        <i id="login-btn-icon" class="fa-solid fa-right-to-bracket"></i>
        <span id="login-btn-text">লগইন করুন →</span>
      </button>
    </form>

    <div class="pt-2 border-t border-emerald-100 text-center space-y-2 text-xs text-emerald-800">
      <p>নতুন ইউজার? <a href="/signup" class="font-extrabold text-emerald-700 underline">ফ্রি অ্যাকাউন্ট খুলুন</a></p>
    </div>
  </div>
</div>

<script>
function toggleLoginPw() {
  const input = document.getElementById("login-pw");
  const eye = document.getElementById("login-pw-eye");
  if (input.type === "password") {
    input.type = "text";
    eye.className = "fa-solid fa-eye-slash text-xs";
  } else {
    input.type = "password";
    eye.className = "fa-solid fa-eye text-xs";
  }
}

document.getElementById("login-form").addEventListener("submit", function () {
  const btn = document.getElementById("login-submit-btn");
  const icon = document.getElementById("login-btn-icon");
  const text = document.getElementById("login-btn-text");
  btn.disabled = true;
  if (icon) icon.className = "fa-solid fa-spinner fa-spin";
  if (text) text.innerText = "লগইন হচ্ছে...";
});
</script>
{% endblock %}
