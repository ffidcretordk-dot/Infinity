{% extends "base_public.html" %}
{% block title %}সাইনআপ - InfinityWork{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-10">
  <div class="glass-card rounded-[2rem] p-6 sm:p-8 w-full max-w-md space-y-5">
    <!-- Logo + Single Heading + Free/No Deposit Highlight -->
    <div class="text-center space-y-2">
      <a href="/" class="inline-flex items-center gap-2 font-extrabold text-xl text-emerald-950">
        <span class="w-9 h-9 rounded-xl bg-emerald-900 text-white flex items-center justify-center shadow-sm">
          <i class="fa-solid fa-infinity text-sm"></i>
        </span>
        <span>InfinityWork</span>
      </a>

      <h1 class="text-2xl font-extrabold text-emerald-950 pt-1">নতুন অ্যাকাউন্ট খুলুন</h1>

      <div class="inline-flex items-center gap-1.5 bg-emerald-100 border border-emerald-200 text-emerald-900 px-3.5 py-1 rounded-full text-xs font-extrabold">
        <i class="fa-solid fa-shield-check text-emerald-700"></i>
        <span>এটি সম্পূর্ণ ফ্রি সাইট • No Deposit</span>
      </div>
    </div>

    <!-- Minimal Signup Form -->
    <form id="signup-form" action="/signup" method="POST" class="space-y-3.5">
      <input type="hidden" name="device_id" id="device_id_input" value="" />
      <input type="hidden" name="lock_token" id="lock_token_input" value="" />

      <div>
        <label class="text-xs font-bold text-emerald-900 block mb-1">আপনার নাম</label>
        <input type="text" name="name" required placeholder="যেমন: আরিফুল ইসলাম"
               class="w-full px-4 py-3 rounded-2xl border border-emerald-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
      </div>

      <div>
        <label class="text-xs font-bold text-emerald-900 block mb-1">ইমেইল</label>
        <input type="email" name="email" required placeholder="you@gmail.com"
               class="w-full px-4 py-3 rounded-2xl border border-emerald-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
      </div>

      <div>
        <label class="text-xs font-bold text-emerald-900 block mb-1">পাসওয়ার্ড</label>
        <div class="relative">
          <input id="signup-pw" type="password" name="password" required minlength="6" placeholder="কমপক্ষে ৬ অক্ষর"
                 class="w-full px-4 py-3 pr-10 rounded-2xl border border-emerald-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
          <button type="button" onclick="toggleSignupPw()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-emerald-700">
            <i id="signup-pw-eye" class="fa-solid fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-emerald-900 block mb-1">রেফারেল কোড (অপশনাল — ১০৳ বোনাস)</label>
        <input type="text" name="referral_code" value="{{ ref_code }}" placeholder="থাকলে কোড দিন"
               class="w-full px-4 py-3 rounded-2xl border border-emerald-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm uppercase font-bold" />
      </div>

      <button id="signup-submit-btn" type="submit"
              class="w-full btn-primary-green text-white py-3.5 rounded-full font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 disabled:opacity-60">
        <span id="signup-btn-text">ফ্রি অ্যাকাউন্ট তৈরি করুন →</span>
      </button>
    </form>

    <p class="text-center text-xs text-emerald-800 pt-1">
      আগেই অ্যাকাউন্ট আছে? <a href="/login" class="font-extrabold text-emerald-700 underline">লগইন করুন</a>
    </p>
  </div>
</div>

<script>
function toggleSignupPw() {
  const input = document.getElementById("signup-pw");
  const eye = document.getElementById("signup-pw-eye");
  if (input.type === "password") {
    input.type = "text";
    eye.className = "fa-solid fa-eye-slash text-xs";
  } else {
    input.type = "password";
    eye.className = "fa-solid fa-eye text-xs";
  }
}

document.getElementById("signup-form").addEventListener("submit", async function (e) {
  const devInput = document.getElementById("device_id_input");
  const btn = document.getElementById("signup-submit-btn");
  const text = document.getElementById("signup-btn-text");

  if (!devInput.value && typeof getOrCreateDeviceId === "function") {
    e.preventDefault();
    await getOrCreateDeviceId();
    this.submit();
    return;
  }

  btn.disabled = true;
  if (text) text.innerText = "অ্যাকাউন্ট তৈরি হচ্ছে...";
});
</script>
{% endblock %}
