<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}InfinityWork - কাজ করুন, আয় করুন{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
      background: linear-gradient(180deg, #effcf4 0%, #f6fef9 50%, #e7f9ee 100%);
      color: #0b3b24;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 35px -8px rgba(13, 74, 43, 0.08);
    }
    .btn-primary-green {
      background: linear-gradient(135deg, #166534 0%, #0d4a2b 100%);
      box-shadow: 0 10px 24px -6px rgba(13, 74, 43, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <!-- Top-Left Animated Flash Messages -->
  <div class="fixed top-4 left-4 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none">
    {% for flash in flashes %}
    <div class="iw-flash-toast pointer-events-auto opacity-0 -translate-x-8 transition-all duration-300 ease-out rounded-2xl px-4 py-3 shadow-xl border flex items-center gap-3 text-sm font-medium
      {% if flash.category == 'error' %}bg-red-50 border-red-200 text-red-800
      {% elif flash.category == 'info' %}bg-emerald-50 border-emerald-200 text-emerald-900
      {% else %}bg-white border-emerald-300 text-emerald-950{% endif %}">
      <span class="w-2.5 h-2.5 rounded-full shrink-0 {% if flash.category == 'error' %}bg-red-500{% else %}bg-emerald-500 animate-pulse{% endif %}"></span>
      <span>{{ flash.message }}</span>
    </div>
    {% endfor %}
  </div>

  {% block content %}{% endblock %}

  <!-- Floating Telegram Support Widget -->
  <a href="{{ support_url }}" target="_blank" rel="noopener"
     class="fixed bottom-5 right-5 z-40 flex items-center gap-2 bg-white/95 hover:bg-emerald-50 border border-emerald-200 text-emerald-900 px-4 py-2.5 rounded-full shadow-xl transition hover:-translate-y-0.5">
    <span class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    </span>
    <span class="text-xs font-bold">সাপোর্ট</span>
  </a>

  <script src="/static/js/app.js"></script>
</body>
</html>
