<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfinityWork</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#effcf4" />
  <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
  <link rel="icon" type="image/png" href="/pwa-icon/192.png" />
  <link rel="apple-touch-icon" href="/pwa-icon/192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
      background: linear-gradient(145deg, #e2faec 0%, #f4fdf8 52%, #d5f6e3 100%);
    }
    .neu-logo-card {
      background: #ecfcf2;
      box-shadow: 14px 14px 28px #bfe0cd, -14px -14px 28px #ffffff;
      animation: neuScaleIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .neu-pill {
      background: #ecfcf2;
      box-shadow: 6px 6px 14px #c3e2cf, -6px -6px 14px #ffffff;
    }
    .neu-track {
      background: #e3f7eb;
      box-shadow: inset 4px 4px 8px #bedec9, inset -4px -4px 8px #ffffff;
    }
    .splash-exit {
      opacity: 0;
      transform: scale(1.06);
      filter: blur(6px);
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes neuScaleIn {
      0% { opacity: 0; transform: scale(0.72) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes infinityDraw {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    .infinity-stroke {
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      animation: infinityDraw 1.1s 0.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden select-none">
  <div id="launch-wrap" class="flex flex-col items-center max-w-xs w-full px-6 text-center space-y-6">
    <div class="neu-logo-card w-28 h-28 rounded-[2rem] flex items-center justify-center">
      <svg class="w-16 h-16 text-emerald-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path class="infinity-stroke" d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/>
      </svg>
    </div>

    <div class="space-y-2">
      <h1 class="text-3xl font-extrabold tracking-tight text-emerald-950">InfinityWork</h1>
      <div class="neu-pill inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold text-emerald-800">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span>কাজ করুন, আয় করুন • Trusted Income</span>
      </div>
    </div>

    <div class="w-full space-y-2">
      <div class="neu-track w-full h-3.5 rounded-full p-1 overflow-hidden">
        <div id="launch-bar" class="h-full rounded-full bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-800 transition-all duration-150" style="width: 0%"></div>
      </div>
      <div class="flex items-center justify-between text-[11px] font-bold text-emerald-800/80 px-1">
        <span id="launch-status">অ্যাপ প্রস্তুত হচ্ছে...</span>
        <span id="launch-pct" class="font-extrabold text-emerald-950">0%</span>
      </div>
    </div>
  </div>

  <script>
    sessionStorage.setItem("iw_custom_splash_done", "1");
    let pct = 0;
    const bar = document.getElementById("launch-bar");
    const pctEl = document.getElementById("launch-pct");
    const statusEl = document.getElementById("launch-status");
    const wrap = document.getElementById("launch-wrap");

    const iv = setInterval(() => {
      pct += Math.floor(Math.random() * 14) + 8;
      if (pct >= 100) pct = 100;
      bar.style.width = `${pct}%`;
      pctEl.innerText = `${pct}%`;

      if (pct >= 40 && pct < 80) statusEl.innerText = "ড্যাশবোর্ড লোড হচ্ছে...";
      else if (pct >= 80 && pct < 100) statusEl.innerText = "স্বাগতম! প্রবেশ করা হচ্ছে...";
      else if (pct === 100) {
        clearInterval(iv);
        setTimeout(() => {
          wrap.classList.add("splash-exit");
          setTimeout(() => window.location.replace("{{ target_url }}"), 450);
        }, 200);
      }
    }, 85);
  </script>
</body>
        </html>
