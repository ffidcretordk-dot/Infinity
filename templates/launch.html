<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfinityWork</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#e2faec" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icon/192.png" />

  <!-- Preload Dashboard Assets while splash animates -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preload" as="script" href="https://cdn.tailwindcss.com" />
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #e2faec 0%, #f4fdf8 52%, #d5f6e3 100%);
      color: #052e16;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 300px;
      padding: 0 24px;
      text-align: center;
      gap: 22px;
    }
    .neu-card {
      width: 112px;
      height: 112px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ecfcf2;
      box-shadow: 14px 14px 28px #bfe0cd, -14px -14px 28px #ffffff;
      animation: neuScaleIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .neu-card svg { width: 64px; height: 64px; color: #065f46; }
    .infinity-stroke {
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      animation: infinityDraw 0.9s 0.05s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: #022c22; }
    .neu-pill {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #065f46;
      background: #ecfcf2;
      box-shadow: 6px 6px 14px #c3e2cf, -6px -6px 14px #ffffff;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 1.2s infinite; }
    .progress-box { width: 100%; }
    .neu-track {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      padding: 3px;
      background: #e3f7eb;
      box-shadow: inset 4px 4px 8px #bedec9, inset -4px -4px 8px #ffffff;
    }
    .bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #14b8a6, #065f46);
      transition: width 0.1s ease;
    }
    .meta {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #065f46;
      padding: 0 4px;
    }
    @keyframes neuScaleIn {
      0% { opacity: 0; transform: scale(0.75) translateY(14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes infinityDraw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
  </style>
</head>
<body>
  <div id="launch-wrap" class="wrap">
    <div class="neu-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path class="infinity-stroke" d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/>
      </svg>
    </div>

    <div>
      <div class="title">InfinityWork</div>
      <div class="neu-pill"><span class="dot"></span><span>কাজ করুন, আয় করুন</span></div>
    </div>

    <div class="progress-box">
      <div class="neu-track"><div id="launch-bar" class="bar"></div></div>
      <div class="meta">
        <span id="launch-status">অ্যাপ প্রস্তুত হচ্ছে...</span>
        <span id="launch-pct">0%</span>
      </div>
    </div>
  </div>

  <script>
    sessionStorage.setItem("iw_custom_splash_done", "1");

    const bar = document.getElementById("launch-bar");
    const pctEl = document.getElementById("launch-pct");
    const statusEl = document.getElementById("launch-status");
    const targetUrl = "{{ target_url }}";

    let pct = 0;
    let prefetchedHtml = null;
    let finalUrl = targetUrl;
    let entered = false;

    // 1. Start fetching Dashboard HTML immediately in background while splash plays
    fetch(targetUrl, { credentials: "same-origin" })
      .then(async (res) => {
        if (res.ok) {
          finalUrl = res.url || targetUrl;
          prefetchedHtml = await res.text();
        }
      })
      .catch(() => {});

    function enterDashboard() {
      if (entered) return;
      entered = true;
      if (prefetchedHtml) {
        // Instant 0ms swap with ZERO blank screen!
        history.replaceState(null, "", finalUrl);
        document.open();
        document.write(prefetchedHtml);
        document.close();
      } else {
        window.location.replace(targetUrl);
      }
    }

    // 2. Smooth progress bar waits at 92% only if network is still fetching, never shows blank screen
    const iv = setInterval(() => {
      if (pct < 92) {
        pct += Math.floor(Math.random() * 14) + 10;
        if (pct > 92) pct = 92;
      } else if (prefetchedHtml) {
        pct = 100;
      }

      bar.style.width = pct + "%";
      pctEl.innerText = pct + "%";

      if (pct >= 35 && pct < 80) statusEl.innerText = "ড্যাশবোর্ড লোড হচ্ছে...";
      else if (pct >= 80 && pct < 100) statusEl.innerText = "প্রবেশ করা হচ্ছে...";
      else if (pct === 100) {
        statusEl.innerText = "স্বাগতম!";
        clearInterval(iv);
        setTimeout(enterDashboard, 120);
      }
    }, 65);

    // Safety fallback if network is super slow (>5s)
    setTimeout(() => {
      if (!entered) {
        clearInterval(iv);
        bar.style.width = "100%";
        pctEl.innerText = "100%";
        enterDashboard();
      }
    }, 5000);
  </script>
</body>
</html>
